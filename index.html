<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Ana Soares • Nail Designer</title>
    <meta name="description"
        content="Ana Soares — Nail Designer. Veja meus trabalhos, serviços e agende seu horário." />
    <meta name="theme-color" content="#1b191d" />
    <meta property="og:title" content="Ana Soares • Nail Designer" />
    <meta property="og:description" content="Agende seu horário de unhas." />
    <meta property="og:image" content="perfil-ana-unha.jpg" />
    <link rel="icon" href="perfil-ana-unha.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400;1,9..144,600&family=Manrope:wght@400;500;600;700&display=swap"
        rel="stylesheet" />

    <style>
        /* =========================================================
       🎨 CORES — troque aqui
       ========================================================= */
        :root {
            /* cores da marca: Magenta Vívido, Carmim Pastel, Roxo Acinzentado */
            --dark: #1b191d;
            /* fundo escuro */
            --magenta: #fb4ea8;
            /* cor principal / botão */
            --pastel: #fb9bbb;
            /* rosa claro (detalhes) */
            --ink: #fbf3f7;
            /* texto */
            --ink-soft: rgba(251, 243, 247, .7);
            --line: rgba(251, 155, 187, .28);
            --card: rgba(27, 25, 29, .62);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Manrope', system-ui, sans-serif;
            color: var(--ink);
            min-height: 100vh;
            overflow-x: hidden;
            background: var(--dark);
            -webkit-font-smoothing: antialiased;
        }

        /* fundo de corações (fixo, escurecido para o texto ficar legível) */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;
            background:
                linear-gradient(180deg, rgba(27, 25, 29, .7) 0%, rgba(27, 25, 29, .82) 40%, rgba(27, 25, 29, .9) 100%),
                url("fundo.jpeg") center / cover no-repeat,
                var(--dark);
        }

        /* logo no topo */
        .brand {
            display: block;
            width: 112px;
            height: auto;
            margin: 4px auto 4px;
            filter: drop-shadow(0 0 18px rgba(251, 78, 168, .45));
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .serif {
            font-family: 'Fraunces', Georgia, serif;
        }

        main {
            width: 100%;
            max-width: 440px;
            margin: 0 auto;
            padding: calc(22px + env(safe-area-inset-top)) 18px calc(36px + env(safe-area-inset-bottom));
            position: relative;
        }

        .reveal {
            opacity: 0;
            transform: translateY(22px);
            animation: up .9s cubic-bezier(.16, 1, .3, 1) forwards;
        }

        @keyframes up {
            to {
                opacity: 1;
                transform: none;
            }
        }

        /* ---------- topo ---------- */

        /* ---------- hero: foto em formato de unha ---------- */
        .hero {
            text-align: center;
            margin-top: 18px;
        }

        .nail-wrap {
            position: relative;
            width: 148px;
            height: 196px;
            margin: 0 auto;
        }

        .nail {
            position: absolute;
            inset: 0;
            overflow: hidden;
            border-radius: 50% 50% 44% 44% / 62% 62% 38% 38%;
            /* formato amendoado */
            background: linear-gradient(160deg, var(--pastel), var(--magenta) 60%, #8a1f58);
            box-shadow: 0 0 0 3px var(--pastel), 0 0 34px rgba(251, 78, 168, .55), 0 26px 50px -18px rgba(0, 0, 0, .7);
        }

        .nail img {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center 20%;
            display: block;
        }

        .nail .ini {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            font-family: 'Fraunces', serif;
            font-style: italic;
            font-size: 52px;
            color: rgba(255, 255, 255, .9);
        }

        .nail::after {
            /* brilho de esmalte */
            content: "";
            position: absolute;
            top: 9%;
            left: 20%;
            width: 18%;
            height: 46%;
            border-radius: 50%;
            background: linear-gradient(180deg, rgba(255, 255, 255, .75), rgba(255, 255, 255, 0));
            filter: blur(1px);
            transform: rotate(-8deg);
            pointer-events: none;
        }

        .nail::before {
            /* reflexo que passa */
            content: "";
            position: absolute;
            inset: -20%;
            z-index: 2;
            pointer-events: none;
            background: linear-gradient(115deg, transparent 40%, rgba(255, 255, 255, .4) 50%, transparent 60%);
            transform: translateX(-100%);
            animation: gloss 5s ease-in-out 1.2s infinite;
        }

        @keyframes gloss {
            0% {
                transform: translateX(-100%);
            }

            30%,
            100% {
                transform: translateX(100%);
            }
        }

        .drop {
            position: absolute;
            border-radius: 50% 50% 50% 0;
            transform: rotate(-45deg);
            background: var(--magenta);
            box-shadow: inset -2px 2px 0 rgba(255, 255, 255, .35), 0 0 10px rgba(251, 78, 168, .6);
            animation: bob 4s ease-in-out infinite;
        }

        .drop.d1 {
            width: 16px;
            height: 16px;
            right: -18px;
            top: 30px;
        }

        .drop.d2 {
            width: 10px;
            height: 10px;
            left: -14px;
            bottom: 44px;
            background: var(--pastel);
            animation-delay: -2s;
        }

        @keyframes bob {
            50% {
                translate: 0 -8px;
            }
        }

        .name {
            font-family: 'Fraunces', serif;
            font-weight: 600;
            font-size: 38px;
            letter-spacing: -.02em;
            line-height: 1;
            margin-top: 22px;
        }

        .name {
            text-shadow: 0 2px 18px rgba(0, 0, 0, .6);
        }

        .name em {
            font-weight: 400;
            color: var(--magenta);
        }

        .role {
            margin-top: 10px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-size: 11.5px;
            font-weight: 700;
            letter-spacing: .3em;
            text-transform: uppercase;
            color: var(--ink-soft);
        }

        .role i {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--magenta);
            display: inline-block;
        }

        .bio {
            margin: 14px auto 0;
            max-width: 300px;
            font-size: 14.5px;
            line-height: 1.5;
            color: var(--ink-soft);
        }

        /* ---------- botões ---------- */
        .cta {
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 24px;
            height: 58px;
            border-radius: 20px;
            background: linear-gradient(180deg, #ff6cb9, var(--magenta) 55%, #e23d93);
            color: #fff;
            font-weight: 800;
            font-size: 15.5px;
            letter-spacing: .01em;
            text-shadow: 0 1px 2px rgba(120, 10, 70, .45);
            box-shadow: 0 0 26px rgba(251, 78, 168, .45), 0 16px 30px -12px rgba(0, 0, 0, .7), inset 0 1px 0 rgba(255, 255, 255, .35);
            transition: transform .25s;
        }

        .cta svg {
            width: 21px;
            height: 21px;
        }

        .cta::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(115deg, transparent 35%, rgba(255, 255, 255, .28) 50%, transparent 65%);
            transform: translateX(-120%);
            animation: gloss 4.5s ease-in-out 2s infinite;
        }

        .cta:active {
            transform: scale(.97);
        }

        .duo {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }

        .ghost {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            height: 50px;
            border-radius: 18px;
            background: var(--card);
            border: 1px solid var(--line);
            font-weight: 600;
            font-size: 14px;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: transform .25s, background .25s;
        }

        .ghost svg {
            width: 18px;
            height: 18px;
            color: var(--magenta);
        }

        .ghost:active {
            transform: scale(.96);
        }

        .ghost:hover {
            background: rgba(251, 78, 168, .16);
        }

        /* ---------- títulos de seção ---------- */
        .sec {
            margin-top: 36px;
        }

        .sec-head {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            margin: 0 2px 14px;
        }

        .sec-head h2 {
            font-family: 'Fraunces', serif;
            font-weight: 400;
            font-style: italic;
            font-size: 25px;
            letter-spacing: -.01em;
        }

        .sec-head a {
            font-size: 12px;
            font-weight: 700;
            color: var(--pastel);
            letter-spacing: .04em;
        }

        /* ---------- galeria (unhas) ---------- */
        .gallery {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scroll-padding-inline: 18px;
            margin: 0 -18px;
            padding: 4px 18px 18px;
            scrollbar-width: none;
        }

        .gallery::-webkit-scrollbar {
            display: none;
        }

        .shot {
            flex: none;
            width: 112px;
            height: 150px;
            scroll-snap-align: start;
            position: relative;
            overflow: hidden;
            border-radius: 50% 50% 40% 40% / 58% 58% 42% 42%;
            box-shadow: 0 0 0 2px rgba(251, 155, 187, .85), 0 0 18px rgba(251, 78, 168, .35), 0 14px 26px -14px rgba(0, 0, 0, .8);
        }

        .shot:nth-child(even) {
            margin-top: 18px;
        }

        /* poucas fotos: centraliza e deixa maiores */
        .gallery.few {
            justify-content: center;
            overflow: visible;
        }

        .gallery.few .shot {
            width: 140px;
            height: 188px;
        }

        .shot img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform .8s cubic-bezier(.16, 1, .3, 1);
        }

        .shot:hover img {
            transform: scale(1.08);
        }

        .shot::after {
            content: "";
            position: absolute;
            top: 10%;
            left: 22%;
            width: 16%;
            height: 40%;
            border-radius: 50%;
            background: linear-gradient(180deg, rgba(255, 255, 255, .65), transparent);
            pointer-events: none;
        }

        /* ---------- onde atendo ---------- */
        .place {
            display: flex;
            gap: 14px;
            align-items: center;
            padding: 16px;
            border-radius: 24px;
            color: #fff;
            position: relative;
            overflow: hidden;
            background: radial-gradient(120% 120% at 100% 0%, rgba(251, 78, 168, .55) 0%, transparent 55%), linear-gradient(160deg, #2b2028, var(--dark));
            border: 1px solid var(--line);
            box-shadow: 0 20px 36px -20px rgba(0, 0, 0, .8);
            transition: transform .25s;
        }

        .place:active {
            transform: scale(.98);
        }

        .place .pin {
            flex: none;
            width: 50px;
            height: 50px;
            border-radius: 16px;
            display: grid;
            place-items: center;
            background: rgba(255, 255, 255, .12);
            border: 1px solid rgba(255, 255, 255, .25);
        }

        .place .pin svg {
            width: 22px;
            height: 22px;
        }

        .place small {
            display: block;
            font-size: 10.5px;
            font-weight: 700;
            letter-spacing: .24em;
            text-transform: uppercase;
            color: var(--pastel);
        }

        .place b {
            display: block;
            font-family: 'Fraunces', serif;
            font-size: 21px;
            font-weight: 600;
            margin: 2px 0 3px;
        }

        .place p {
            font-size: 12.5px;
            line-height: 1.4;
            color: rgba(255, 255, 255, .72);
        }

        footer {
            margin-top: 34px;
            text-align: center;
        }

        footer .sig {
            font-family: 'Fraunces', serif;
            font-style: italic;
            font-size: 20px;
            color: var(--pastel);
        }

        footer p {
            margin-top: 6px;
            font-size: 11px;
            letter-spacing: .2em;
            text-transform: uppercase;
            color: var(--ink-soft);
        }

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation: none !important;
                transition: none !important;
            }

            .reveal {
                opacity: 1;
                transform: none;
            }
        }
    </style>
</head>

<body>
    <main>
        <img class="brand reveal" src="logo-as.png" alt="Ana Soares Nail Designer" onerror="this.remove()" />
        <section class="hero">
            <div class="nail-wrap reveal" style="animation-delay:.08s">
                <div class="nail">
                    <span class="ini" id="ini"></span>
                    <img id="foto" alt="" onerror="this.remove()" />
                </div>
                <span class="drop d1"></span><span class="drop d2"></span>
            </div>
            <h1 class="name reveal" id="nome" style="animation-delay:.16s"></h1>
            <div class="role reveal" style="animation-delay:.22s"><i></i><span id="cargo"></span><i></i></div>
            <p class="bio reveal" id="bio" style="animation-delay:.28s"></p>

            <a class="cta reveal" id="cta" target="_blank" rel="noopener" style="animation-delay:.36s"></a>
            <div class="duo reveal" style="animation-delay:.44s">
                <a class="ghost" id="btnIg" target="_blank" rel="noopener"></a>
                <a class="ghost" id="btnMap" target="_blank" rel="noopener"></a>
            </div>
        </section>

        <section class="sec reveal" style="animation-delay:.52s">
            <div class="sec-head">
                <h2>Meus trabalhos</h2><a id="verMais" target="_blank" rel="noopener">ver mais →</a>
            </div>
            <div class="gallery" id="gallery"></div>
        </section>

        <section class="sec reveal" style="animation-delay:.6s">
            <a class="place" id="place" target="_blank" rel="noopener"></a>
        </section>

        <footer class="reveal" style="animation-delay:.68s">
            <div class="sig" id="sig"></div>
            <p id="copy"></p>
        </footer>
    </main>

    <script>
        /* =========================================================
           ✏️ CONFIGURAÇÃO — edite só este bloco
           Fotos ficam na mesma pasta do index.html (nome exato, com maiúsculas).
           Sem a foto, aparece um fundo de "esmalte" no lugar.
           ========================================================= */
        const ANA = {
            nome: "Ana Soares",
            cargo: "Nail Designer",
            bio: "Unhas impecáveis, feitas com calma e capricho em cada detalhe.",
            foto: "perfil-ana-unha.jpg",
            instagram: "_anasoares.nails",
            whatsapp: "5511967671895",          // DDI + DDD + número, só dígitos
            mensagem: "Oi, tudo bem? Queria agendar um horário para fazer unhas. Você tem disponibilidade?",
            studio: {
                nome: "ELA Studio",
                endereco: "",                     // ex.: "Rua X, 123 · Bairro · São Paulo/SP" (vazio = "Toque para abrir no mapa")
                maps: "https://share.google/X2NZj3bEXJFEJInc8",
            },
            // Fotos dos trabalhos (adicione ou remova à vontade)
            // "pos" = qual parte da foto aparece (ex.: "center 60%")
            trabalhos: [
                { src: "unha1.jpeg", pos: "30% 64%" },
                { src: "unha2.PNG", pos: "center 45%" },
                { src: "unha3.jpeg", pos: "45% center" },
                { src: "unha4.jpeg", pos: "35% center" },
                { src: "unha5.jpeg", pos: "50% center" },
                { src: "unha6.jpeg", pos: "72% center" },
            ],
        };
        /* ========================================================= */

        const ICON = {
            wa: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.5l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.2-.2-.5-.3z"/></svg>',
            ig: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg>',
            pin: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.1-7-11.5A7 7 0 0 1 19 9.5C19 14.9 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>',
            chev: '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>',
        };
        const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
        const wa = (msg) => `https://wa.me/${ANA.whatsapp}?text=${encodeURIComponent(msg)}`;
        const igUrl = `https://www.instagram.com/${ANA.instagram}`;
        const polish = ["#fb4ea8", "#fb9bbb", "#1b191d", "#e23d93", "#3a2a35", "#ffc2d9"];

        document.title = `${ANA.nome} • ${ANA.cargo}`;
        const [first, ...rest] = ANA.nome.split(" ");
        document.getElementById("nome").innerHTML = `${esc(first)} <em>${esc(rest.join(" "))}</em>`;
        document.getElementById("ini").textContent = ANA.nome.split(" ").map((p) => p[0]).slice(0, 2).join("");
        const foto = document.getElementById("foto"); foto.alt = ANA.nome; foto.src = ANA.foto;
        document.getElementById("cargo").textContent = ANA.cargo;
        document.getElementById("bio").textContent = ANA.bio;

        const cta = document.getElementById("cta");
        cta.href = wa(ANA.mensagem);
        cta.innerHTML = `${ICON.wa}<span>Agendar meu horário</span>`;
        const btnIg = document.getElementById("btnIg"); btnIg.href = igUrl; btnIg.innerHTML = `${ICON.ig}<span>Instagram</span>`;
        const btnMap = document.getElementById("btnMap"); btnMap.href = ANA.studio.maps; btnMap.innerHTML = `${ICON.pin}<span>Como chegar</span>`;
        document.getElementById("verMais").href = igUrl;

        const gallery = document.getElementById("gallery");
        if (ANA.trabalhos.length <= 3) gallery.classList.add("few");
        gallery.innerHTML = ANA.trabalhos.map((t, i) => `
      <a class="shot" href="${igUrl}" target="_blank" rel="noopener" style="background:linear-gradient(160deg, ${polish[i % polish.length]}, ${polish[(i + 2) % polish.length]})">
        <img src="${t.src}" alt="Trabalho ${i + 1}" loading="lazy" style="object-position:${t.pos || "center"}" onerror="this.remove()">
      </a>`).join("");

        document.getElementById("place").href = ANA.studio.maps;
        document.getElementById("place").innerHTML = `
      <span class="pin">${ICON.pin}</span>
      <span><small>Onde atendo</small><b>${esc(ANA.studio.nome)}</b><p>${esc(ANA.studio.endereco || "Toque para abrir no mapa")}</p></span>`;

        document.getElementById("sig").textContent = "com carinho, " + first;
        document.getElementById("copy").textContent = `@${ANA.instagram}`;
    </script>
</body>

</html>
